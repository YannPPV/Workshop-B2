<html lang="fr"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portail Dimensionnel - Rick &amp; Morty</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<main class="container1" style="width: 100%;height: 822px;max-width: 800px;padding: 3px;">
    <div class="container">

            
        <!-- Écran d'accueil -->
        <section id="accueil" class="screen active">
            <div class="mainContainer">
            <div class="title">Warp Gate Detector</div>
            <div class="title middle">Warp Gate Detector</div>
            <div class="title bottom">Warp Gate Detector</div>
            </div>
            <button id="detectButton" class="main-button">
                <span>Détecter</span>
            </button>
        </section>


        <!-- Écran blague -->
        <section id="blague" class="screen">
            <div class="mainContainer">
            <div class="title">Warp Gate Detector</div>
            <div class="title middle">Warp Gate Detector</div>
            <div class="title bottom">Warp Gate Detector</div>
            </div>
            <h2>Raconte-moi une blague nulle avant</h2>

            <button id="microButton" class="main-button">
                <span class="micro">🎙️</span>
            </button>

            <p id="status">Clique sur le micro pour commencer</p>
        </section>


        <!-- Résultat -->
        <section id="resultat" class="screen">
            <div class="mainContainer">
            <div class="title">Warp Gate Detector</div>
            <div class="title middle">Warp Gate Detector</div>
            <div class="title bottom">Warp Gate Detector</div>
            </div>
            <h2 id="resultText"></h2>
        </section>

    </div>
</main>

    <script src="src/script.js"></script>


</body></html>
